# ?????
spring.datasource.url=jdbc:mysql://localhost:3306/IPD?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus ??
mybatis-plus.type-aliases-package=com.example.ipd_sp_back_end.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ?????
server.port=8081

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Assistant (DeepSeek)
assistant.deepseek.base-url=https://api.deepseek.com
assistant.deepseek.model=deepseek-chat
assistant.deepseek.api-key=${DEEPSEEK_API_KEY:}

# Auth (JWT)
auth.jwt.secret=${AUTH_JWT_SECRET:Q29kZXhJcERKc29uV2ViVG9rZW5TZWN1cml0eUtleUZvclNwcmludDVJbnRlZ3JhdGVkUHJvamVjdA==}
auth.jwt.expiration-seconds=${AUTH_JWT_EXPIRATION_SECONDS:604800}
